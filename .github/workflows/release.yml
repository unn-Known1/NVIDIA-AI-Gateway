name: Release NVIDIA AI Gateway

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v2.0.0)

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: nvidia-ai-gateway
            asset_name: nvidia-ai-gateway-linux-amd64
          - os: windows-latest
            artifact_name: nvidia-ai-gateway.exe
            asset_name: nvidia-ai-gateway-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller pyinstaller.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: nvidia-ai-gateway-linux-amd64
          path: dist-linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: nvidia-ai-gateway-windows-amd64.exe
          path: dist-windows

      - name: Rename assets for release
        run: |
          mv dist-linux/nvidia-ai-gateway nvidia-ai-gateway-linux-amd64
          mv dist-windows/nvidia-ai-gateway.exe nvidia-ai-gateway-windows-amd64.exe
          chmod +x nvidia-ai-gateway-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nvidia-ai-gateway-linux-amd64
            nvidia-ai-gateway-windows-amd64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
